name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/main.dart lib/src test
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: check
    env:
      # With the four ANDROID_* repository secrets (docs/RELEASE.md § 1) the
      # bundle is signed with the upload key and can go to Play Console as
      # is; without them it is signed with the debug key, which only proves
      # that it builds.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "Release signed with the upload key: ready for Play Console." >> "$GITHUB_STEP_SUMMARY"
      - name: Note the debug key
        if: env.HAS_UPLOAD_KEY != 'true'
        run: |
          echo "No ANDROID_KEYSTORE_BASE64 secret: release signed with the debug key, not uploadable (docs/RELEASE.md § 1)." >> "$GITHUB_STEP_SUMMARY"
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  screenshots:
    # Store screenshots in every language, rendered by the widget tests.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test test/screenshots
        env:
          LUMIFX_SCREENSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: build/screenshots
          retention-days: 30

  ios:
    # macOS minutes are expensive: run on main, pull requests, manual runs,
    # or a push whose commit message contains [ios]. Tags are built by
    # release.yml.
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --release --no-codesign
