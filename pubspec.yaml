name: lumifx
description: Cross-platform Philips Hue scenes, stories and interactive lighting effects.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  nsd: ^5.0.1
  pointycastle: ^4.0.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0E1028"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

flutter_native_splash:
  color: "#0B1020"
  image: assets/icon/splash.png
  android_12:
    color: "#0B1020"
    image: assets/icon/icon_foreground.png
  web: false
